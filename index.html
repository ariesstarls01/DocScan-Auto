<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">

<title>DocScan Auto</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  background:#050505;
  color:white;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",
              "Segoe UI",sans-serif;
}

body{
  overflow-x:hidden;
}

button{
  font:inherit;
}

/* =========================
   HOME
========================= */

#home{
  min-height:100%;
  background:#111;
}

header{
  height:58px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:21px;
  font-weight:700;
}

#status{
  min-height:34px;
  padding:7px 15px 10px;
  text-align:center;
  color:#aaa;
  font-size:13px;
}

.toolbar{
  display:flex;
  gap:10px;
  padding:0 14px 14px;
}

.action{
  flex:1;
  border:0;
  border-radius:14px;
  padding:14px 10px;
  font-weight:600;
  font-size:16px;
  background:#252525;
  color:#fff;
}

.action.primary{
  background:#fff;
  color:#111;
}

.fileButton{
  flex:1;
  border-radius:14px;
  padding:14px 10px;
  font-weight:600;
  font-size:16px;
  background:#252525;
  color:#fff;
  text-align:center;
}

.fileButton input{
  display:none;
}

#pages{
  padding:8px 14px 100px;
}

.page{
  position:relative;
  margin-bottom:18px;
  overflow:hidden;
  border-radius:14px;
  background:#222;
}

.page img{
  display:block;
  width:100%;
  height:auto;
}

.pageNumber{
  position:absolute;
  top:10px;
  left:10px;
  padding:6px 10px;
  border-radius:20px;
  background:rgba(0,0,0,.72);
  font-size:13px;
}

.remove{
  position:absolute;
  top:10px;
  right:10px;
  width:38px;
  height:38px;
  border:0;
  border-radius:50%;
  background:rgba(0,0,0,.75);
  color:white;
  font-size:22px;
}

.empty{
  padding:80px 25px;
  text-align:center;
  color:#777;
  font-size:16px;
}

#bottom{
  position:fixed;
  left:0;
  right:0;
  bottom:0;

  display:flex;
  gap:10px;

  padding:
    10px
    14px
    calc(10px + env(safe-area-inset-bottom));

  background:rgba(17,17,17,.94);
  backdrop-filter:blur(15px);

  z-index:10;
}

#bottom button{
  flex:1;
  border:0;
  border-radius:14px;
  padding:13px;
  font-weight:600;
  background:#252525;
  color:#fff;
}

#bottom .primary{
  background:#fff;
  color:#111;
}

#bottom button:disabled{
  opacity:.4;
}

/* =========================
   CAMERA
========================= */

#camera{
  position:fixed;
  inset:0;

  display:none;
  flex-direction:column;

  background:#000;

  z-index:100;
}

#camera.open{
  display:flex;
}

#cameraTop{
  height:70px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 16px;

  background:#000;
}

.close{
  width:44px;
  height:44px;

  border:0;
  border-radius:50%;

  background:#222;
  color:#fff;

  font-size:28px;
}

.cameraTitle{
  font-weight:700;
  font-size:18px;
}

#viewport{
  position:relative;
  flex:1;
  overflow:hidden;
  background:#000;
}

#video{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  object-fit:cover;
}

#previewCanvas{
  display:none;
}

#overlay{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  pointer-events:none;
}

#quad{
  fill:rgba(0,224,176,.08);

  stroke:#00e0b0;

  stroke-width:5;

  stroke-linejoin:round;

  opacity:0;

  filter:drop-shadow(0 0 4px #000);
}

#quad.found{
  opacity:1;
}

#hint{
  position:absolute;

  left:0;
  right:0;
  bottom:20px;

  text-align:center;

  color:#fff;

  font-size:14px;

  text-shadow:
    0 1px 5px #000,
    0 0 8px #000;

  pointer-events:none;
}

#cameraBottom{
  position:relative;

  height:135px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#000;
}

#shutter{
  width:78px;
  height:78px;

  border-radius:50%;

  border:5px solid #00e0b0;

  background:#fff;

  box-shadow:
    0 0 0 3px rgba(0,224,176,.18);
}

#shutter:active{
  transform:scale(.94);
}

#shutter:disabled{
  opacity:.4;
}

#cameraGallery{
  position:absolute;

  left:25px;

  width:52px;
  height:52px;

  display:flex;
  align-items:center;
  justify-content:center;

  border:0;
  border-radius:14px;

  background:#222;

  color:#fff;

  font-size:24px;
}

#cameraGallery input{
  display:none;
}

</style>
</head>


<body>

<!-- =========================
     HOME
========================= -->

<div id="home">

<header>
  DocScan Auto
</header>

<div id="status">
  Bấm "Chụp tài liệu"
</div>

<div class="toolbar">

  <button
    id="openCamera"
    class="action primary">

    📷 Chụp tài liệu

  </button>


  <label class="fileButton">

    🖼️ Thư viện

    <input
      id="galleryInput"
      type="file"
      accept="image/*"
      multiple>

  </label>

</div>


<div id="pages">

  <div class="empty">

    Chưa có tài liệu

    <br>

    <small>
      Chụp → tự tìm 4 góc → tự căn thẳng.
    </small>

  </div>

</div>


<div id="bottom">

  <button
    id="clearBtn"
    disabled>

    Xóa hết

  </button>


  <button
    id="pdfBtn"
    class="primary"
    disabled>

    📄 Xuất PDF

  </button>

</div>

</div>


<!-- =========================
     CAMERA
========================= -->

<div id="camera">

  <div id="cameraTop">

    <button
      id="closeCamera"
      class="close">

      ×

    </button>


    <div class="cameraTitle">
      Quét tài liệu
    </div>


    <div style="width:44px"></div>

  </div>


  <div id="viewport">

    <video
      id="video"
      autoplay
      muted
      playsinline>
    </video>


    <canvas
      id="previewCanvas">
    </canvas>


    <svg
      id="overlay"
      preserveAspectRatio="none">

      <polygon
        id="quad"
        points="">
      </polygon>

    </svg>


    <div id="hint">
      Đưa toàn bộ giấy vào khung
    </div>

  </div>


  <div id="cameraBottom">

    <label id="cameraGallery">

      🖼️

      <input
        id="cameraGalleryInput"
        type="file"
        accept="image/*"
        multiple>

    </label>


    <button
      id="shutter"
      aria-label="Chụp">
    </button>

  </div>

</div>


<script type="module">

/* ==========================================
   SCANIC
========================================== */

import {
  scanDocument,
  extractDocument
}
from "https://cdn.jsdelivr.net/npm/scanic@1.6.0/dist/scanic.js";


/* ==========================================
   STATE
========================================== */

let pages = [];

let stream = null;

let detecting = false;

let detectionTimer = null;

let liveCorners = null;

let cameraRunning = false;


/* ==========================================
   ELEMENTS
========================================== */

const statusEl =
  document.getElementById("status");

const pagesEl =
  document.getElementById("pages");

const openCamera =
  document.getElementById("openCamera");

const closeCamera =
  document.getElementById("closeCamera");

const camera =
  document.getElementById("camera");

const video =
  document.getElementById("video");

const previewCanvas =
  document.getElementById("previewCanvas");

const overlay =
  document.getElementById("overlay");

const quad =
  document.getElementById("quad");

const hint =
  document.getElementById("hint");

const shutter =
  document.getElementById("shutter");

const galleryInput =
  document.getElementById("galleryInput");

const cameraGalleryInput =
  document.getElementById("cameraGalleryInput");

const clearBtn =
  document.getElementById("clearBtn");

const pdfBtn =
  document.getElementById("pdfBtn");


/* ==========================================
   STATUS
========================================== */

function setStatus(text){

  statusEl.textContent = text;

}


/* ==========================================
   CORNER NORMALIZATION
========================================== */

function normalizeCorners(corners){

  if(!corners){
    return null;
  }


  function point(p){

    if(Array.isArray(p)){

      return {
        x:Number(p[0]),
        y:Number(p[1])
      };

    }


    return {
      x:Number(p.x),
      y:Number(p.y)
    };

  }


  if(
    corners.topLeft &&
    corners.topRight &&
    corners.bottomRight &&
    corners.bottomLeft
  ){

    return [

      point(corners.topLeft),

      point(corners.topRight),

      point(corners.bottomRight),

      point(corners.bottomLeft)

    ];

  }


  if(
    Array.isArray(corners) &&
    corners.length === 4
  ){

    return corners.map(point);

  }


  return null;

}


/* ==========================================
   DRAW LIVE QUAD
========================================== */

function drawQuad(corners){

  if(
    !corners ||
    !video.videoWidth ||
    !video.videoHeight
  ){

    quad.classList.remove("found");

    return;

  }


  overlay.setAttribute(
    "viewBox",
    `0 0 ${video.videoWidth} ${video.videoHeight}`
  );


  quad.setAttribute(
    "points",
    corners
      .map(
        p => `${p.x},${p.y}`
      )
      .join(" ")
  );


  quad.classList.add("found");

}


/* ==========================================
   VIDEO → CANVAS
========================================== */

function makeFrame(){

  const canvas =
    previewCanvas;

  canvas.width =
    video.videoWidth;

  canvas.height =
    video.videoHeight;


  const ctx =
    canvas.getContext("2d");


  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );


  return canvas;

}


/* ==========================================
   LIVE DETECTION
========================================== */

async function detectFrame(){

  if(
    !cameraRunning ||
    detecting ||
    video.readyState < 2
  ){

    return;

  }


  detecting = true;


  try{

    const frame =
      makeFrame();


    const result =
      await scanDocument(
        frame,
        {
          mode:"detect",

          detector:"ml",

          maxProcessingDimension:900,

          ml:{
            minScore:0.30
          }
        }
      );


    if(
      result &&
      result.success
    ){

      const corners =
        normalizeCorners(
          result.corners
        );


      if(corners){

        liveCorners =
          corners;

        drawQuad(
          corners
        );


        hint.textContent =
          "✓ Đã nhận diện tài liệu — bấm chụp";

      }

    }
    else{

      liveCorners =
        null;

      quad.classList.remove(
        "found"
      );

      hint.textContent =
        "Đưa toàn bộ giấy vào khung";

    }

  }
  catch(error){

    console.warn(
      "Detection:",
      error
    );

  }
  finally{

    detecting = false;

  }

}


/* ==========================================
   DETECTION LOOP
========================================== */

function startDetection(){

  if(
    detectionTimer
  ){

    clearInterval(
      detectionTimer
    );

  }


  detectionTimer =
    setInterval(
      detectFrame,
      350
    );

}


/* ==========================================
   STOP DETECTION
========================================== */

function stopDetection(){

  if(
    detectionTimer
  ){

    clearInterval(
      detectionTimer
    );

    detectionTimer =
      null;

  }

}


/* ==========================================
   OPEN CAMERA
========================================== */

async function startCamera(){

  try{

    camera.classList.add(
      "open"
    );


    hint.textContent =
      "Đang mở camera…";


    stream =
      await navigator.mediaDevices.getUserMedia({

        video:{

          facingMode:{
            ideal:"environment"
          },

          width:{
            ideal:1920
          },

          height:{
            ideal:1080
          }

        },

        audio:false

      });


    video.srcObject =
      stream;


    await video.play();


    cameraRunning =
      true;


    shutter.disabled =
      false;


    hint.textContent =
      "Đưa toàn bộ giấy vào khung";


    setStatus(
      "Camera sẵn sàng"
    );


    startDetection();

  }
  catch(error){

    console.error(
      error
    );


    camera.classList.remove(
      "open"
    );


    setStatus(
      "❌ Không mở được camera. Hãy cho phép Camera trong Safari."
    );

  }

}


/* ==========================================
   CLOSE CAMERA
========================================== */

function stopCamera(){

  cameraRunning =
    false;


  stopDetection();


  if(stream){

    stream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );

    stream =
      null;

  }


  video.srcObject =
    null;


  liveCorners =
    null;


  quad.classList.remove(
    "found"
  );


  camera.classList.remove(
    "open"
  );

}


/* ==========================================
   CAPTURE DOCUMENT
========================================== */

async function captureDocument(){

  if(
    !video.videoWidth
  ){

    return;

  }


  shutter.disabled =
    true;


  hint.textContent =
    "Đang căn thẳng tài liệu…";


  try{

    const frame =
      makeFrame();


    let result =
      null;


    /*
      Nếu realtime detector
      đã tìm được 4 góc,
      dùng chính 4 góc đó
      để crop.
    */

    if(
      liveCorners
    ){

      try{

        result =
          await extractDocument(
            frame,
            liveCorners,
            {
              output:"canvas"
            }
          );

      }
      catch(error){

        console.warn(
          "Extract failed:",
          error
        );

      }

    }


    /*
      Nếu realtime detection
      chưa có kết quả,
      chạy detection lần nữa
      trên ảnh vừa chụp.
    */

    if(
      !result ||
      !result.success
    ){

      result =
        await scanDocument(
          frame,
          {
            mode:"extract",

            detector:"ml",

            output:"canvas",

            maxProcessingDimension:2200,

            ml:{
              minScore:0.30
            }
          }
        );

    }


    if(
      !result ||
      !result.success ||
      !result.output
    ){

      hint.textContent =
        "Không tìm thấy đủ 4 góc — thử lại";


      return;

    }


    /*
      Lưu ảnh đã crop + perspective correction
    */

    const dataUrl =
      result.output.toDataURL(
        "image/jpeg",
        0.88
      );


    pages.push(
      dataUrl
    );


    renderPages();


    hint.textContent =
      "✓ Đã quét xong";


    setStatus(
      `✅ Trang ${pages.length} đã tự động cắt và căn thẳng`
    );


    setTimeout(
      () => {

        if(
          camera.classList.contains(
            "open"
          )
        ){

          hint.textContent =
            "Đưa trang tiếp theo vào khung";

        }

      },
      700
    );

  }
  catch(error){

    console.error(
      error
    );


    hint.textContent =
      "❌ Có lỗi — hãy thử lại";

  }
  finally{

    shutter.disabled =
      false;

  }

}


/* ==========================================
   FILE → IMAGE
========================================== */

function fileToImage(file){

  return new Promise(
    (resolve,reject)=>{

      const url =
        URL.createObjectURL(
          file
        );


      const img =
        new Image();


      img.onload = () => {

        URL.revokeObjectURL(
          url
        );

        resolve(img);

      };


      img.onerror = () => {

        URL.revokeObjectURL(
          url
        );

        reject(
          new Error(
            "Không đọc được ảnh"
          )
        );

      };


      img.src =
        url;

    }
  );

}


/* ==========================================
   SCAN PHOTO FROM GALLERY
========================================== */

async function scanFile(file){

  try{

    setStatus(
      "Đang tìm 4 góc và căn thẳng…"
    );


    const image =
      await fileToImage(
        file
      );


    let result =
      await scanDocument(
        image,
        {
          mode:"extract",

          detector:"ml",

          output:"canvas",

          maxProcessingDimension:2200,

          ml:{
            minScore:0.30
          }
        }
      );


    /*
      Fallback classical detector
    */

    if(
      !result ||
      !result.success ||
      !result.output
    ){

      result =
        await scanDocument(
          image,
          {
            mode:"extract",

            output:"canvas",

            maxProcessingDimension:2200
          }
        );

    }


    if(
      !result ||
      !result.success ||
      !result.output
    ){

      setStatus(
        "❌ Không tìm thấy đủ 4 góc"
      );

      return;

    }


    pages.push(
      result.output.toDataURL(
        "image/jpeg",
        0.88
      )
    );


    renderPages();


    setStatus(
      "✅ Đã tự động cắt và căn thẳng"
    );

  }
  catch(error){

    console.error(
      error
    );


    setStatus(
      "❌ Không xử lý được ảnh"
    );

  }

}


/* ==========================================
   RENDER PAGES
========================================== */

function renderPages(){

  pagesEl.innerHTML =
    "";


  if(
    pages.length === 0
  ){

    pagesEl.innerHTML = `

      <div class="empty">

        Chưa có tài liệu

        <br>

        <small>
          Chụp → tự tìm 4 góc → tự căn thẳng.
        </small>

      </div>

    `;

  }
  else{

    pages.forEach(
      (src,index)=>{

        const box =
          document.createElement(
            "div"
          );


        box.className =
          "page";


        box.innerHTML = `

          <img src="${src}">

          <div class="pageNumber">
            Trang ${index + 1}
          </div>

          <button
            class="remove"
            onclick="removePage(${index})">

            ×

          </button>

        `;


        pagesEl.appendChild(
          box
        );

      }
    );

  }


  clearBtn.disabled =
    pages.length === 0;

  pdfBtn.disabled =
    pages.length === 0;

}


/* ==========================================
   REMOVE PAGE
========================================== */

window.removePage =
function(index){

  pages.splice(
    index,
    1
  );


  renderPages();


  setStatus(
    pages.length
      ? `Đã giữ lại ${pages.length} trang`
      : "Chưa có tài liệu"
  );

};


/* ==========================================
   CLEAR
========================================== */

window.clearPages =
function(){

  if(
    !pages.length
  ){

    return;

  }


  if(
    confirm(
      "Xóa toàn bộ tài liệu?"
    )
  ){

    pages =
      [];


    renderPages();


    setStatus(
      "Đã xóa toàn bộ"
    );

  }

};


/* ==========================================
   PDF
========================================== */

window.makePDF =
async function(){

  if(
    !pages.length
  ){

    return;

  }


  try{

    setStatus(
      "Đang tạo PDF…"
    );


    const jsPDF =
      window.jspdf.jsPDF;


    let pdf =
      null;


    for(
      let i=0;
      i<pages.length;
      i++
    ){

      const img =
        new Image();


      await new Promise(
        (resolve,reject)=>{

          img.onload =
            resolve;

          img.onerror =
            reject;

          img.src =
            pages[i];

        }
      );


      const width =
        img.naturalWidth;


      const height =
        img.naturalHeight;


      const orientation =
        width > height
          ? "landscape"
          : "portrait";


      if(
        i === 0
      ){

        pdf =
          new jsPDF({

            orientation,

            unit:"px",

            format:[
              width,
              height
            ],

            compress:true

          });

      }
      else{

        pdf.addPage(
          [
            width,
            height
          ],
          orientation
        );

      }


      pdf.addImage(
        pages[i],
        "JPEG",
        0,
        0,
        width,
        height,
        undefined,
        "FAST"
      );

    }


    const now =
      new Date();


    const filename =
      "DocScan-" +

      now.getFullYear() +

      "-" +

      String(
        now.getMonth()+1
      ).padStart(
        2,
        "0"
      ) +

      "-" +

      String(
        now.getDate()
      ).padStart(
        2,
        "0"
      ) +

      ".pdf";


    pdf.save(
      filename
    );


    setStatus(
      "✅ PDF đã tạo xong"
    );

  }
  catch(error){

    console.error(
      error
    );


    setStatus(
      "❌ Không tạo được PDF"
    );

  }

};


/* ==========================================
   BUTTONS
========================================== */

openCamera.onclick =
  startCamera;


closeCamera.onclick =
  stopCamera;


shutter.onclick =
  captureDocument;


/* ==========================================
   GALLERY
========================================== */

galleryInput.addEventListener(
  "change",
  async event => {

    const files =
      Array.from(
        event.target.files || []
      );


    for(
      const file of files
    ){

      await scanFile(
        file
      );

    }


    event.target.value =
      "";

  }
);


/* ==========================================
   CAMERA GALLERY
========================================== */

cameraGalleryInput.addEventListener(
  "change",
  async event => {

    const files =
      Array.from(
        event.target.files || []
      );


    stopCamera();


    for(
      const file of files
    ){

      await scanFile(
        file
      );

    }


    event.target.value =
      "";

  }
);


/* ==========================================
   INIT
========================================== */

renderPages();

</script>

</body>
</html>
