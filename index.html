<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>DocScan Auto</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:#111;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",
               "Segoe UI",sans-serif;
}

header{
  padding:18px 18px 12px;
  text-align:center;
  font-size:24px;
  font-weight:700;
}

#status{
  min-height:24px;
  text-align:center;
  padding:4px 18px 12px;
  color:#aaa;
  font-size:14px;
}

.toolbar{
  display:flex;
  gap:10px;
  padding:0 14px 14px;
}

button,
.fileButton{
  flex:1;
  border:0;
  border-radius:14px;
  padding:14px 10px;
  font-size:16px;
  font-weight:600;
  background:#252525;
  color:#fff;
  text-align:center;
}

button.primary,
.fileButton.primary{
  background:#fff;
  color:#111;
}

button:disabled{
  opacity:.4;
}

.fileButton input{
  display:none;
}

#pages{
  padding:8px 14px 100px;
}

.page{
  position:relative;
  margin-bottom:18px;
  border-radius:14px;
  overflow:hidden;
  background:#222;
}

.page img{
  display:block;
  width:100%;
  height:auto;
}

.pageNumber{
  position:absolute;
  top:10px;
  left:10px;
  background:rgba(0,0,0,.7);
  padding:6px 10px;
  border-radius:20px;
  font-size:13px;
}

.remove{
  position:absolute;
  top:10px;
  right:10px;
  width:38px;
  height:38px;
  padding:0;
  border-radius:50%;
  background:rgba(0,0,0,.75);
  color:#fff;
}

.empty{
  text-align:center;
  color:#777;
  padding:80px 25px;
  font-size:16px;
}

#bottom{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  background:rgba(17,17,17,.94);
  backdrop-filter:blur(15px);
  display:flex;
  gap:10px;
  z-index:10;
}

#bottom button{
  padding:13px;
}
</style>
</head>

<body>

<header>DocScan Auto</header>

<div id="status">
  Chụp hoặc chọn ảnh tài liệu
</div>

<div class="toolbar">

  <label class="fileButton primary">
    📷 Chụp
    <input
      id="cameraInput"
      type="file"
      accept="image/*"
      capture="environment">
  </label>

  <label class="fileButton">
    🖼️ Thư viện
    <input
      id="galleryInput"
      type="file"
      accept="image/*">
  </label>

</div>

<div id="pages">
  <div class="empty">
    Chưa có tài liệu<br>
    <small>Ảnh sau khi chụp sẽ tự tìm 4 góc và căn thẳng.</small>
  </div>
</div>

<div id="bottom">
  <button id="clearBtn" onclick="clearPages()" disabled>
    Xóa hết
  </button>

  <button
    id="pdfBtn"
    class="primary"
    onclick="makePDF()"
    disabled>
    📄 Xuất PDF
  </button>
</div>

<script type="module">

let scanDocument = null;
let pages = [];

const statusEl = document.getElementById("status");
const pagesEl = document.getElementById("pages");
const cameraInput = document.getElementById("cameraInput");
const galleryInput = document.getElementById("galleryInput");
const clearBtn = document.getElementById("clearBtn");
const pdfBtn = document.getElementById("pdfBtn");

function status(text){
  statusEl.textContent = text;
}

async function loadScanic(){

  if(scanDocument) return;

  status("Đang tải bộ nhận diện tài liệu…");

  const urls = [
    "https://cdn.jsdelivr.net/npm/scanic@1.6.0/dist/scanic.js",
    "https://unpkg.com/scanic@1.6.0/dist/scanic.js"
  ];

  let lastError;

  for(const url of urls){

    try{

      const module = await import(url);

      if(typeof module.scanDocument !== "function"){
        throw new Error("scanDocument không tồn tại");
      }

      scanDocument = module.scanDocument;

      status("Bộ nhận diện đã sẵn sàng.");
      return;

    }catch(error){
      lastError = error;
    }
  }

  throw lastError || new Error("Không tải được Scanic");
}

async function fileToImage(file){

  return new Promise((resolve,reject)=>{

    const url = URL.createObjectURL(file);
    const img = new Image();

    img.onload = ()=>{
      URL.revokeObjectURL(url);
      resolve(img);
    };

    img.onerror = ()=>{
      URL.revokeObjectURL(url);
      reject(new Error("Không đọc được ảnh"));
    };

    img.src = url;
  });
}

async function scanFile(file){

  try{

    await loadScanic();

    status("Đang tìm 4 góc tài liệu…");

    const image = await fileToImage(file);

    /*
      ML detector:
      - tìm tài liệu
      - xác định 4 góc
      - sửa phối cảnh
    */

    let result;

    try{

      result = await scanDocument(image,{
        mode:"extract",
        detector:"ml",
        output:"canvas",
        maxProcessingDimension:1800,

        ml:{
          minScore:0.35
        }
      });

    }catch(error){

      console.warn("ML detector failed:",error);

      status("ML không nhận được, đang thử bộ nhận diện dự phòng…");

      result = await scanDocument(image,{
        mode:"extract",
        output:"canvas",
        maxProcessingDimension:1800
      });
    }

    if(!result || !result.success || !result.output){

      status("Không tìm thấy đủ 4 góc. Hãy chụp lại rõ hơn.");

      return;
    }

    const canvas = result.output;

    /*
      JPEG 0.80:
      giữ chữ rõ nhưng PDF không quá nặng.
    */

    const dataUrl = canvas.toDataURL(
      "image/jpeg",
      0.80
    );

    pages.push(dataUrl);

    renderPages();

    status(
      "✅ Đã tự động nhận diện và căn thẳng tài liệu"
    );

  }catch(error){

    console.error(error);

    status(
      "❌ Có lỗi khi xử lý ảnh. Hãy thử lại."
    );
  }
}

function renderPages(){

  pagesEl.innerHTML = "";

  if(pages.length === 0){

    pagesEl.innerHTML = `
      <div class="empty">
        Chưa có tài liệu<br>
        <small>
          Ảnh sau khi chụp sẽ tự tìm 4 góc và căn thẳng.
        </small>
      </div>
    `;

  }else{

    pages.forEach((src,index)=>{

      const box = document.createElement("div");
      box.className = "page";

      box.innerHTML = `
        <img src="${src}">
        <div class="pageNumber">
          Trang ${index + 1}
        </div>

        <button
          class="remove"
          onclick="removePage(${index})">
          ×
        </button>
      `;

      pagesEl.appendChild(box);
    });
  }

  clearBtn.disabled = pages.length === 0;
  pdfBtn.disabled = pages.length === 0;
}

window.removePage = function(index){

  pages.splice(index,1);

  renderPages();

  status(
    pages.length
      ? `Đã giữ lại ${pages.length} trang`
      : "Chưa có tài liệu"
  );
};

window.clearPages = function(){

  if(!pages.length) return;

  if(confirm("Xóa toàn bộ tài liệu?")){

    pages = [];

    renderPages();

    status("Đã xóa toàn bộ");
  }
};

window.makePDF = async function(){

  if(!pages.length) return;

  try{

    status("Đang tạo PDF…");

    const jsPDF = window.jspdf.jsPDF;

    let pdf = null;

    for(let i=0;i<pages.length;i++){

      const img = new Image();

      await new Promise((resolve,reject)=>{

        img.onload = resolve;
        img.onerror = reject;

        img.src = pages[i];
      });

      const width = img.naturalWidth;
      const height = img.naturalHeight;

      const orientation =
        width > height
          ? "landscape"
          : "portrait";

      if(i === 0){

        pdf = new jsPDF({
          orientation,
          unit:"px",
          format:[width,height],
          compress:true
        });

      }else{

        pdf.addPage(
          [width,height],
          orientation
        );
      }

      pdf.addImage(
        pages[i],
        "JPEG",
        0,
        0,
        width,
        height,
        undefined,
        "FAST"
      );
    }

    const now = new Date();

    const filename =
      "DocScan-" +
      now.getFullYear() +
      "-" +
      String(now.getMonth()+1).padStart(2,"0") +
      "-" +
      String(now.getDate()).padStart(2,"0") +
      ".pdf";

    pdf.save(filename);

    status("✅ PDF đã tạo xong");

  }catch(error){

    console.error(error);

    status("❌ Không tạo được PDF");
  }
};

cameraInput.addEventListener(
  "change",
  async(event)=>{

    const file = event.target.files?.[0];

    if(file){
      await scanFile(file);
    }

    event.target.value = "";
  }
);

galleryInput.addEventListener(
  "change",
  async(event)=>{

    const files = Array.from(event.target.files || []);

    for(const file of files){

      await scanFile(file);
    }

    event.target.value = "";
  }
);

renderPages();

</script>

</body>
</html>
